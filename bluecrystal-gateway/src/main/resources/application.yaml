server:
  port: 8080

spring:
  application:
    name: gateway
  # 说明：不使用 Nacos 配置中心，所有配置都写在本文件（以及环境变量）里；
  #      Nacos 只当注册中心用，发现服务的地址见下面的 discovery。
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # Spring Cloud Gateway 4.2+ / 5.x 的配置前缀（旧前缀 spring.cloud.gateway.* 已废弃）
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                exposedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            # /internal/** 是服务间内部接口（扣余额、回写订单支付状态等），一律挡在网关之外。
            # 这条规则放在最前面；服务间 Feign 调用走服务名直连，不经过网关。
            - id: internal-deny
              uri: no://op
              order: -1
              predicates:
                - Path=/internal/**
              filters:
                - SetStatus=403
            - id: item-service
              uri: lb://item-service
              predicates:
                - Path=/items/**,/search/**
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/carts/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**,/addresses/**
            - id: trade-service
              uri: lb://trade-service
              predicates:
                - Path=/orders/**
            - id: pay-service
              uri: lb://pay-service
              predicates:
                - Path=/pay-orders/**

bc:
  jwt:
    # 网关与 user-service 必须使用同一个密钥；UTF-8 编码后不少于 32 字节
    secret: ${BLUECRYSTAL_JWT_SECRET:bluecrystal-mall-dev-secret-change-me-32bytes}
    ttl: ${BLUECRYSTAL_JWT_TTL:30m}
  auth:
    # 免登录白名单：只放行只读的商品/搜索、登录接口，以及网关自身的健康检查
    exclude-paths:
      - /search/**
      - /users/login
      - /items/**
      - /actuator/health

logging:
  level:
    root: info
    com.bluecrystal: debug
  pattern:
    dateformat: HH:mm:ss.SSS
  file:
    name: logs/${spring.application.name}/${spring.application.name}.log

management:
  # 注意：Spring Cloud 2025.0.x 的 gateway 模块（4.3.x）没有注册 actuator 的 gateway 端点，
  # 因此这里只暴露 health/info；需要看路由请开 DEBUG 日志或使用 Gateway 的 RouteDefinitionRepository。
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
