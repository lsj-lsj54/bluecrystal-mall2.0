server:
  port: 8084

spring:
  application:
    name: user-service
  # 本地默认连本机 MySQL（环境变量可覆盖）；需要由 Nacos 集中管理数据源时打开 shared-jdbc.yaml
  config:
    import:
      - optional:nacos:shared-log.yaml
      - optional:nacos:shared-seata.yaml
      # - optional:nacos:shared-jdbc.yaml
      # - optional:nacos:shared-swagger.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${bc.db.database}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      max-lifetime: 1800000
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        file-extension: yaml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8090}
      http-method-specify: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      update-strategy: not_null

bc:
  db:
    database: bc-user
  jwt:
    # 网关与 user-service 必须使用同一个密钥；UTF-8 编码后不少于 32 字节
    secret: ${BLUECRYSTAL_JWT_SECRET:bluecrystal-mall-dev-secret-change-me-32bytes}
    ttl: ${BLUECRYSTAL_JWT_TTL:30m}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
