# 本地基础设施：MySQL / Redis / Nacos / Sentinel / Seata
# 注意：镜像 tag 未在本机联网核实（本机 hosts 屏蔽了 Docker Hub），拉取失败时按注释里的备选 tag 调整。
services:
  mysql:
    # 8.4 为 LTS；8.4 起已移除 --default-authentication-plugin 参数，故此处不再传入
    image: mysql:8.4
    container_name: bluecrystal-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-123}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - bluecrystal-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # item-service 的商品缓存使用 Redis；Redis 不可用时服务会自动降级为直接查库
    image: redis:7.4-alpine
    container_name: bluecrystal-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - bluecrystal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    # 与 SCA 2025.0.0.0 管理的 nacos-client 3.0.3 对齐；若该 tag 不存在可回退 v2.5.1（3.x 客户端兼容 2.x 服务端）
    image: nacos/nacos-server:v3.0.3
    container_name: bluecrystal-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
      # Nacos 3.x 控制台独立端口 8080，宿主机 8080 已被网关占用，故映射到 8858
      - "8858:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "U2VjcmV0S2V5MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODk="
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    # Nacos 3.x 的健康检查路径与 2.x 不同，未联网核实前不写死，避免容器被误报为 unhealthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v3/console/health/liveness"]

  sentinel:
    # 控制台为社区镜像；版本与 SCA 2025.0.0.0 管理的 sentinel-core 1.8.9 对齐
    image: bladex/sentinel-dashboard:1.8.9
    container_name: bluecrystal-sentinel
    restart: unless-stopped
    ports:
      - "8090:8858"

  seata-server:
    # SCA 2025.0.0.0 管理 seata 2.5.0；2.x 控制台端口为 7091
    image: seataio/seata-server:2.5.0
    container_name: bluecrystal-seata
    restart: unless-stopped
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
      TZ: Asia/Shanghai

volumes:
  bluecrystal-mysql-data:
  bluecrystal-redis-data:
