# Nacos 共享配置
# Data ID: shared-jdbc.yaml    Group: DEFAULT_GROUP    格式: YAML
# 说明：各服务通过 spring.config.import 引入；这里只放「所有服务一致」的数据源与 MyBatis-Plus 约定。
# 库名由各服务自己的 application.yaml 通过 bc.db.database 提供（bc-item / bc-cart / ...）。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${bc.db.host:localhost}:${bc.db.port:3306}/${bc.db.database}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${bc.db.un:root}
    password: ${bc.db.pw:123}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      max-lifetime: 1800000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 打印 SQL，生产环境换成 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 只更新非空字段，避免把未传字段写成 null
      update-strategy: not_null
