# Nacos 共享配置
# Data ID: shared-swagger.yaml    Group: DEFAULT_GROUP    格式: YAML
# 说明：骨架默认把这段配置直接写在各服务的 application.yaml 里（本地无 Nacos 也能看文档）。
#      需要集中管理时，删除各服务本地的那几行，并在 spring.config.import 中打开 shared-swagger.yaml。
#
# 接口文档选型：springdoc-openapi 2.8.17 提供 OpenAPI 3 文档（/v3/api-docs、/swagger-ui.html），
#              外加 knife4j-openapi3-ui 4.5.0 的静态增强 UI（/doc.html）。
#              不要引入 knife4j 的 spring-boot-starter：它内置 springdoc 2.3.0，在 Boot 3.5 下会抛
#              NoSuchMethodError: SpringDocConfigProperties.getGroupConfigs()，导致 /v3/api-docs 直接 500。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json
